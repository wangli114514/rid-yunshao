# Paste this single location block inside the domain's existing Baota Nginx
# server {} block, or configure the same target in Baota's Reverse Proxy UI
# and enable WebSocket support. Replace any existing `location /` for the site.

location / {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    # The edge still limits ordinary APIs to 1 MiB; this outer limit permits the
    # dedicated /api/airspace/import route to accept its validated 20 MiB maximum.
    client_max_body_size 20m;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
